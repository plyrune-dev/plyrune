# Proof claims (tauten proof tier; `cargo tauten init --proofs` generated
# this file). `cargo tauten proofs` runs the gate below and records one
# outcome per claim in proofs/claims.json: proved, drift, build-failed,
# audit-failed, mutant-survived or tool-missing.
version = 1

[[claim]]
crate = "plyrune-kernel"
file = "crates/plyrune-kernel/src/binding.rs"
function = "same_store"
lean = "plyrune_kernel.binding.same_store"
theorems = ["Proofs.Binding.same_store_spec"]
total = "Proofs.Binding.same_store_spec"
mutants = ["ignore-owner", "ignore-incarnation"]

[[mutant]]
name = "ignore-owner"
file = "crates/plyrune-kernel/src/binding.rs"
before = "expected.owner.0 == presented.owner.0 && "
after = ""
direct = ["Proofs.Binding.same_store_spec"]

[[mutant]]
name = "ignore-incarnation"
file = "crates/plyrune-kernel/src/binding.rs"
before = " && expected.incarnation.0 == presented.incarnation.0"
after = ""
direct = ["Proofs.Binding.same_store_spec"]

[gate]
# Run from the workspace root. proofs/run.sh checks for Docker and the
# pinned image, then runs proofs/gate.py in it.
command = ["sh", "proofs/in-container.sh"]
# Only translate (`cargo tauten proofs extract [--crate <dir>]`): the
# authoritative check that kernel code stays inside what the toolchain
# translates, without building the proofs.
extract = ["sh", "proofs/in-container.sh", "--extract-only"]
# The developer loop (`cargo tauten proofs try --theorems T… | --mutants M…`):
# every stage, but only the named mutants, in parallel; never recorded.
try = ["sh", "proofs/in-container.sh", "--only-mutants"]
# Crate directories the gate translates with Charon/Aeneas.
crates = ["crates/plyrune-kernel"]

[[claim]]
crate = "plyrune-kernel"
file = "crates/plyrune-kernel/src/range.rs"
function = "admit"
lean = "plyrune_kernel.range.admit"
theorems = ["Proofs.Range.admit_spec"]
total = "Proofs.Range.admit_spec"
mutants = ["past-end-accepted", "reversed-accepted"]

[[mutant]]
name = "past-end-accepted"
file = "crates/plyrune-kernel/src/range.rs"
before = "start > end || end > len"
after = "start > end || (end > len && start > end)"
direct = ["Proofs.Range.admit_spec"]

[[mutant]]
name = "reversed-accepted"
file = "crates/plyrune-kernel/src/range.rs"
before = "start > end || end > len"
after = "end > len"
direct = ["Proofs.Range.admit_spec"]

[[claim]]
crate = "plyrune-kernel"
file = "crates/plyrune-kernel/src/range.rs"
function = "char_boundary"
lean = "plyrune_kernel.range.char_boundary"
theorems = ["Proofs.Text.boundary_spec"]
total = "Proofs.Text.boundary_spec"
mutants = ["accept-continuation"]

[[mutant]]
name = "accept-continuation"
file = "crates/plyrune-kernel/src/range.rs"
before = "Some(byte) => !is_continuation(*byte)"
after = "Some(byte) => is_continuation(*byte)"
direct = ["Proofs.Text.boundary_spec"]

[[claim]]
crate = "plyrune-kernel"
file = "crates/plyrune-kernel/src/range.rs"
function = "admit_text"
lean = "plyrune_kernel.range.admit_text"
theorems = ["Proofs.Text.admit_text_spec"]
total = "Proofs.Text.admit_text_spec"
mutants = ["ignore-end-boundary"]

[[mutant]]
name = "ignore-end-boundary"
file = "crates/plyrune-kernel/src/range.rs"
before = "char_boundary(bytes, start) && char_boundary(bytes, end)"
after = "char_boundary(bytes, start)"
direct = ["Proofs.Text.admit_text_spec"]

[[claim]]
crate = "plyrune-kernel"
file = "crates/plyrune-kernel/src/capture.rs"
function = "admit_store_range"
lean = "plyrune_kernel.capture.admit_store_range"
theorems = ["Proofs.Capture.store_range_spec"]
total = "Proofs.Capture.store_range_spec"
mutants = ["compare-store-to-itself"]

[[mutant]]
name = "compare-store-to-itself"
file = "crates/plyrune-kernel/src/capture.rs"
before = "same_store(expected, presented)"
after = "same_store(expected, expected)"
direct = ["Proofs.Capture.store_range_spec"]

[[claim]]
crate = "plyrune-kernel"
file = "crates/plyrune-kernel/src/snapshot.rs"
function = "inspect_range"
lean = "plyrune_kernel.snapshot.inspect_range"
theorems = ["Proofs.Snapshot.inspect_spec"]
total = "Proofs.Snapshot.inspect_spec"
mutants = ["omit-high-half", "omit-low-half"]

[[mutant]]
name = "omit-high-half"
file = "crates/plyrune-kernel/src/snapshot.rs"
before = "expected.high == actual.high && "
after = ""
direct = ["Proofs.Snapshot.inspect_spec"]

[[mutant]]
name = "omit-low-half"
file = "crates/plyrune-kernel/src/snapshot.rs"
before = " && expected.low == actual.low"
after = ""
direct = ["Proofs.Snapshot.inspect_spec"]

[[claim]]
crate = "plyrune-kernel"
file = "crates/plyrune-kernel/src/capture.rs"
function = "admit_capture"
lean = "plyrune_kernel.capture.admit_capture"
theorems = ["Proofs.Capture.admit_capture_spec"]
total = "Proofs.Capture.admit_capture_spec"
mutants = ["accept-unknown-schema", "accept-foreign-kind", "capture-self-store", "ignore-resource", "capture-self-snapshot"]

[[mutant]]
name = "accept-unknown-schema"
file = "crates/plyrune-kernel/src/capture.rs"
before = "schema.0 != CaptureSchema::V1.0"
after = "schema.0 < CaptureSchema::V1.0"
direct = ["Proofs.Capture.admit_capture_spec"]

[[mutant]]
name = "accept-foreign-kind"
file = "crates/plyrune-kernel/src/capture.rs"
before = "kind.0 != CaptureKind::TEXT.0"
after = "kind.0 < CaptureKind::TEXT.0"
direct = ["Proofs.Capture.admit_capture_spec"]

[[mutant]]
name = "capture-self-store"
file = "crates/plyrune-kernel/src/capture.rs"
before = "same_store(&presented.store, &actual.store)"
after = "same_store(&presented.store, &presented.store)"
direct = ["Proofs.Capture.admit_capture_spec"]

[[mutant]]
name = "ignore-resource"
file = "crates/plyrune-kernel/src/capture.rs"
before = "presented.resource.0 != actual.resource.0"
after = "presented.resource.0 != presented.resource.0"
direct = ["Proofs.Capture.admit_capture_spec"]

[[mutant]]
name = "capture-self-snapshot"
file = "crates/plyrune-kernel/src/capture.rs"
before = "inspect_range(&presented.snapshot, &actual.snapshot,"
after = "inspect_range(&presented.snapshot, &presented.snapshot,"
direct = ["Proofs.Capture.admit_capture_spec"]
