[package]
name = "plyrune-kernel"
description = "Plyrune's pure decision kernel: range admission, literal selection, coverage and report binding, as total functions over plain data."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.tauten]
tier = "kernel"
layer = "kernel"

# No dependencies by construction, so TAU-T003 needs no allowlist: the proof
# gate translates this crate on its own, and anything it depended on would be
# trusted rather than translated.
[dependencies]

[package.metadata.charon]
start_from = [
    "plyrune_kernel::capture::admit_store_range", "plyrune_kernel::snapshot::inspect_range",
    "plyrune_kernel::capture::admit_capture", "plyrune_kernel::literal::first_match",
    "plyrune_kernel::literal::inventory_matches", "plyrune_kernel::replacement::lower_cut",
    "plyrune_kernel::replacement::consume", "plyrune_kernel::replacement::finished",
    "plyrune_kernel::replacement::same_bytes",
]

[lints.rust]
unsafe_code = "forbid"
